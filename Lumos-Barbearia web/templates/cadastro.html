{% extends "base.html" %}
{% block titulo %}Criar conta - {{ BIZ.nome }}{% endblock %}
{% block corpo %}
<div class="container container-narrow">
    <h2>Criar conta</h2>
    <form method="post" action="{{ url_for('cadastro') }}">
        <input type="hidden" name="csrf_token" value="{{ token_csrf() }}">
        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" value="{{ form.nome }}" autocomplete="name" required>
        </div>
        <div class="campo">
            <label for="telefone">Celular / WhatsApp (com DDD)</label>
            <input type="tel" id="telefone" name="telefone" value="{{ form.telefone }}" placeholder="(11) 99999-9999" autocomplete="tel" required>
        </div>
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ form.email }}" autocomplete="email" required>
        </div>
        <div class="campo">
            <label for="senha">Senha (mínimo 8 caracteres)</label>
            <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required>
        </div>
        <label class="caixa-lgpd">
            <input type="checkbox" name="lgpd" required>
            <span>Autorizo o uso do meu nome, telefone e e-mail apenas para organizar os agendamentos desta barbearia, conforme a <a href="{{ url_for('privacidade') }}">política de privacidade</a> (LGPD, art. 7º, I).</span>
        </label>
        <button type="submit" class="btn btn-primario btn-largo">Cadastrar</button>
    </form>
    <p class="centro miudo">Já tem conta? <a href="{{ url_for('login') }}">Faça login</a></p>
</div>
{% endblock %}
