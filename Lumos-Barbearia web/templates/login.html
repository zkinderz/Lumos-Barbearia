{% extends "base.html" %}
{% block titulo %}Entrar - {{ BIZ.nome }}{% endblock %}
{% block corpo %}
<div class="cartao-auth">
    <h2><i class="fas fa-cut"></i> Entrar</h2>
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ token_csrf() }}">
        <div class="campo">
            <label for="email"><i class="fas fa-user"></i> E-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" required autofocus>
        </div>
        <div class="campo">
            <label for="senha"><i class="fas fa-lock"></i> Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primario btn-largo">Entrar</button>
    </form>
    <p class="centro miudo">Não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
</div>
{% endblock %}
