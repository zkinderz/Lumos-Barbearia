<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar - Lumos Barbearia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; }

        .step-card { 
            background: #222222; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            margin-bottom: 20px; 
            border: 1px solid #c5a059; 
        }

        .step-title { 
            font-size: 1.1em; 
            font-weight: bold; 
            color: #c5a059; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #ffffff; }
        
        .form-group input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #444; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background-color: #2b2b2b; 
            color: #ffffff; 
        }

        .form-group input::placeholder { color: #aaa; }

        .horarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
        .radio-horario { display: none; }

        .label-horario { 
            display: block; 
            text-align: center; 
            padding: 10px; 
            background: #2b2b2b; 
            color: #ffffff; 
            border: 1px solid #444; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
        }

        .radio-horario:checked + .label-horario { 
            background-color: #c5a059; 
            color: #121212; 
            border-color: #c5a059; 
        }

        .label-horario:hover { border-color: #c5a059; }

        .btn-confirmar { 
            width: 100%; 
            padding: 12px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: 0.2s; 
        }
        .btn-confirmar:hover { background-color: #218838; }

        .btn-buscar { 
            padding: 10px 15px; 
            background-color: #c5a059; 
            color: #121212; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .btn-buscar:hover { background-color: #d4af37; }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-calendar-plus"></i> Agendar Horário</h2>
        
        <div class="step-card">
            <div class="step-title"><i class="fas fa-calendar-day"></i> 1. Escolha a data</div>
            <form method="get" style="display: flex; gap: 10px; align-items: center;">
                <input type="date" name="data" min="{{ data_hoje }}" value="{{ request.args.get('data', '') }}" required style="flex: 1; padding: 9px; border: 1px solid #444; border-radius: 6px; background: #2b2b2b; color: #ffffff;">
                <button type="submit" class="btn-buscar"><i class="fas fa-search"></i> Ver Horários</button>
            </form>
        </div>

        {% if horarios %}
            <div class="step-card">
                <div class="step-title"><i class="fas fa-clock"></i> 2. Selecione o horário e informe seus dados</div>
                
                <form method="post">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Seu Nome:</label>
                        <input type="text" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Seu Telefone (WhatsApp):</label>
                        <input type="text" name="telefone" placeholder="(DDD) 99999-9999" required>
                    </div>

                    <div class="form-group">
                        <label>Horários disponíveis para {{ request.args.get('data') }}:</label>
                        <div class="horarios-grid">
                            {% for h in horarios %}
                                <div>
                                    <input type="radio" id="h_{{ loop.index }}" name="horario" value="{{ h }}" class="radio-horario" required>
                                    <label for="h_{{ loop.index }}" class="label-horario">{{ h }}</label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>

                    <input type="hidden" name="data" value="{{ request.args.get('data') }}">
                    <button type="submit" class="btn-confirmar"><i class="fab fa-whatsapp"></i> Confirmar Agendamento</button>
                </form>
            </div>
        {% elif request.args.get('data') %}
            <div class="step-card" style="text-align: center; color: #aaa;">
                <i class="fas fa-calendar-times fa-2x" style="margin-bottom: 10px; color: #dc3545;"></i>
                <p>Não há horários disponíveis para a data selecionada. Tente outro dia!</p>
            </div>
        {% endif %}

        <a href="/" class="btn-link" style="display: block; text-align: center; margin-top: 15px; color: #c5a059;">
            <i class="fas fa-arrow-left"></i> Voltar à Página Inicial
        </a>
    </div>
</body>
</html>
